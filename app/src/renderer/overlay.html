<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' deskat:; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Deskat</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      body.over { cursor: pointer; }
      #cat { position: relative; width: 100%; height: 100%; }
      .stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
      /* source videos: kept in the DOM so they keep decoding, but invisible */
      .vids { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
      .vids video { width: 1px; height: 1px; }
    </style>
  </head>
  <body>
    <div id="cat"></div>
    <script type="module" src="./src/overlay/main.ts"></script>
  </body>
</html>
